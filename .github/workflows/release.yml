# Push a tag vX.Y.Z matching package.json to check the package, build the .unitypackage and publish a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check package
        run: python .github/npire_pkg.py check .
      - name: Tag matches package.json version
        run: |
          v=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi
      - name: Build .unitypackage
        run: python .github/npire_pkg.py unitypackage . --out dist
      - name: Release notes
        run: python .github/npire_pkg.py notes . > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.unitypackage --title "$GITHUB_REF_NAME" --notes-file notes.md
